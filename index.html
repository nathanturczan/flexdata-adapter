<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex Data → Ensemble Room Adapter</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; background: #14161a; color: #d8dce2;
        font: 13px/1.45 "SF Mono", ui-monospace, Menlo, monospace;
      }
      header { padding: 10px 14px; border-bottom: 1px solid #2a2e35; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; }
      h1 { font-size: 14px; margin: 0 12px 0 0; color: #fff; font-weight: 600; }
      .ctrl { display: flex; gap: 6px; align-items: center; }
      .ctrl label { color: #8b93a0; }
      input[type="text"], input[type="number"], textarea {
        background: #1d2026; color: #d8dce2; border: 1px solid #343a44; border-radius: 4px; padding: 4px 6px; font: inherit;
      }
      input[type="number"] { width: 60px; }
      button { background: #2b3b55; color: #dfe7f3; border: 1px solid #3d5278; border-radius: 4px; padding: 4px 10px; font: inherit; cursor: pointer; }
      button:hover { background: #35496b; }
      .status { padding: 6px 14px; display: flex; gap: 24px; border-bottom: 1px solid #2a2e35; }
      .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: #666; }
      .dot.ok { background: #4caf50; } .dot.bad { background: #e05252; }
      #roomId { font-size: 16px; color: #ffd479; cursor: pointer; user-select: all; }
      #banner {
        display: none; margin: 10px 14px; padding: 12px 16px; border: 2px solid #e05252;
        background: #3a1518; color: #ffb3b3; font-size: 15px; font-weight: 700; border-radius: 6px;
      }
      #banner.divergence { border-color: #e0a552; background: #3a2c15; color: #ffdca8; }
      table { width: 100%; border-collapse: collapse; table-layout: fixed; }
      th, td { text-align: left; vertical-align: top; padding: 5px 10px; border-bottom: 1px solid #23262c; word-wrap: break-word; }
      th { position: sticky; top: 0; background: #191c21; color: #8b93a0; font-weight: 600; }
      col.raw { width: 24%; } col.dec { width: 38%; } col.res { width: 38%; }
      .hexw { color: #7aa2f7; }
      .warn { color: #e0a552; }
      .err { color: #e05252; }
      .loss { color: #e0a552; }
      .okw { color: #4caf50; }
      .muted { color: #6b7280; }
      .kind { color: #c3a6ff; }
      .keytok { color: #ffd479; font-weight: 700; }
      #injectRow { padding: 8px 14px; border-bottom: 1px solid #2a2e35; display: flex; gap: 8px; align-items: flex-start; }
      textarea { width: 480px; height: 38px; }
      .small { font-size: 11px; color: #6b7280; }
    </style>
  </head>
  <body>
    <header>
      <h1>Flex Data → Ensemble Room</h1>
      <div class="ctrl">
        <label for="wsUrl">UMP source</label>
        <input type="text" id="wsUrl" value="ws://127.0.0.1:8766" size="20" />
        <button id="wsToggle">Connect</button>
      </div>
      <div class="ctrl">
        <label for="localUrl">local out (LALORK Bridge)</label>
        <input type="text" id="localUrl" value="http://127.0.0.1:8767/harmony" size="26" />
        <input type="checkbox" id="localToggle" checked />
      </div>
      <div class="ctrl">
        <button id="attachBtn">Attach room</button>
      </div>
      <div class="ctrl">
        <label for="shimToggle">Athan key-sig compat shim</label>
        <input type="checkbox" id="shimToggle" checked />
      </div>
      <div class="ctrl">
        <label for="windowMs">batch window (ms)</label>
        <input type="number" id="windowMs" value="50" min="0" step="10" />
      </div>
    </header>

    <div class="status">
      <span><span class="dot" id="wsDot"></span>WS: <span id="wsStatus">disconnected</span></span>
      <span><span class="dot" id="localDot"></span>local: <span id="localStatus">no writes yet</span></span>
      <span>room: <span id="roomId" title="click to copy">not attached</span></span>
      <span class="muted" id="counters"></span>
    </div>

    <div id="banner"></div>

    <div id="injectRow">
      <label class="small" for="inject">inject UMP JSON<br />(one [w0,w1,w2,w3] per line)</label>
      <textarea id="inject" placeholder='[3489679366, 826345472, 0, 0]'></textarea>
      <button id="injectBtn">Inject</button>
    </div>

    <table>
      <colgroup><col class="raw" /><col class="dec" /><col class="res" /></colgroup>
      <thead>
        <tr><th>raw UMP</th><th>decoded semantics (strict spec + compat)</th><th>resolved SN state / write status</th></tr>
      </thead>
      <tbody id="log"></tbody>
    </table>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
